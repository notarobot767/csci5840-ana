<div class="card border-0 shadow-sm rounded-3 overflow-hidden mb-4">
    <!-- Header bar styled like an IDE tab / status bar -->
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-2 px-3">
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-warning text-dark font-monospace text-lowercase">{{ label }}</span>
            <span class="text-light fw-medium font-monospace small">{{ device }}</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-light d-flex align-items-center gap-1" id="copyBtn" onclick="copyYaml()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                    <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                </svg>
                <span id="copyBtnText">Copy</span>
            </button>
        </div>
    </div>

    <!-- Code Display Area without Embedded Vertical Scrollbars -->
    <div class="card-body p-0 position-relative" style="background-color: #1e1e2e !important;">
        {% if content %}
        <div class="overflow-x-auto">
            <table class="w-100 font-monospace border-0 m-0" style="font-size: 0.875rem; line-height: 1.5rem; border-collapse: collapse;">
                <tbody>
                    {% for line in content.splitlines() %}
                    <tr>
                        <!-- Left-aligned line number gutter -->
                        <td class="text-secondary user-select-none text-start ps-3 pe-3 border-end border-secondary border-opacity-25 align-top" 
                            style="width: 1%; white-space: nowrap; opacity: 0.4;">
                            {{ loop.index }}
                        </td>
                        <!-- Left-aligned code cell -->
                        <td class="text-light text-start ps-3 pe-3 align-top" 
                            style="white-space: pre; tab-size: 2;">{{ line if line else ' ' }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <!-- Hidden source for the Copy button to maintain full raw text -->
        <pre id="rawContent" class="d-none">{{ content }}</pre>
        {% else %}
        <div class="p-4 text-secondary text-center font-monospace">
            No configuration found for device: <strong>{{ device }}</strong>
        </div>
        {% endif %}
    </div>
</div>

<script>
function copyYaml() {
    const text = document.getElementById('rawContent').innerText;
    navigator.clipboard.writeText(text).then(() => {
        const btnText = document.getElementById('copyBtnText');
        btnText.innerText = 'Copied!';
        setTimeout(() => {
            btnText.innerText = 'Copy';
        }, 2000);
    });
}
</script>
