#https://www.linode.com/docs/guides/getting-started-with-nginx-part-4-tls-deployment-best-practices/

#ssl_ciphers
ssl_protocols TLSv1.3 TLSv1.2;
ssl_prefer_server_ciphers on;

ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-ECDSA-AES128-GCM-SHA256,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-RSA-AES128-GCM-SHA256,ECDHE-ECDSA-CHACHA20-POLY1305,ECDHE-RSA-CHACHA20-POLY1305,DHE-RSA-AES256-GCM-SHA384,DHE-RSA-AES128-GCM-SHA256;

#cache & timeout
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;
ssl_early_data on;
keepalive_timeout 75;

# dhparam from script
# create_dhparam.sh
ssl_dhparam             /app/certs/dhparam.pem;

# Self Signed ECDSA Cert from script
# create_cert_self_signed.sh
#ssl_certificate         /app/certs/self_signed/cert-chain.pem;
#ssl_certificate_key     /app/certs/self_signed/key.pem;

######################################
# use OCSP when you have a signed cert

# server cert chain and key
#ssl_certificate         /app/certs/self_signed/cert-chain.pem;
#ssl_certificate_key     /app/certs/self_signed/key.pem;

#ssl_certificate         /app/letsencrypt/fullchain.pem;
#ssl_certificate_key     /app/letsencrypt/privkey.pem;

ssl_certificate         /app/letsencrypt/live/macdads.net-ecdsa/fullchain.pem;
ssl_certificate_key     /app/letsencrypt/live/macdads.net-ecdsa/privkey.pem;

