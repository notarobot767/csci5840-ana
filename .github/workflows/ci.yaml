name: CI Pipeline

# Trigger: Equivalent to Jenkins webhooks/triggers
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger via GitHub UI

jobs:
  ping-host:
    runs-on: self-hosted
    steps:
      - name: Print Hello World
        run: |
          echo "Hello World from GitHub Actions running directly on $(hostname)!"
          whoami
          uptime
  
  unit-tests:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/student/docker/5840_www
    steps:
      - name: Get Container Stats
        run: docker compose stats --no-stream
      - name: Run Unit Tests
        run: docker compose exec www pytest -v -n auto