name: CI Pipeline

# Trigger: Equivalent to Jenkins webhooks/triggers
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger via GitHub UI

jobs:
  ping-host:
    # Targets the local daemon running on your Ubuntu box
    runs-on: self-hosted

    steps:
      - name: Print Hello World
        run: |
          echo "Hello World from GitHub Actions running directly on $(hostname)!"
          whoami
          uptime
