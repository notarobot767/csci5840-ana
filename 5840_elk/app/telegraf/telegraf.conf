[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = false
  quiet = false
  logfile = ""

# ---------------------------------------------------------
# Arista Switches (Host-Resources-MIB CPU)
# ---------------------------------------------------------
[[inputs.snmp]]
  agents = [
    "udp://[2600:bad:c0de::1]:161",
    "udp://[2600:bad:c0de::2]:161",
    "udp://[2600:bad:c0de::11]:161",
    "udp://[2600:bad:c0de::12]:161",
    "udp://[2600:bad:c0de::13]:161",
    "udp://[2600:bad:c0de::14]:161"
  ]
  version = 2
  community = "password"
  timeout = "5s"
  retries = 3

  # Base device tag
  [[inputs.snmp.field]]
    name = "hostname"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  # hrProcessorLoad.1 (1-minute average load %)
  [[inputs.snmp.field]]
    name = "cpu_1min_pct"
    oid = "1.3.6.1.2.1.25.3.3.1.2.1"

# ---------------------------------------------------------
# Cisco Devices (CISCO-PROCESS-MIB CPU)
# ---------------------------------------------------------
[[inputs.snmp]]
  agents = [
    "udp://[2600:bad:c0de::3]:161",
    "udp://[2600:bad:c0de::4]:161"
  ]
  version = 2
  community = "password"
  timeout = "5s"
  retries = 3

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  # Set name = "snmp" so measurement matches the Arista scalar metrics
  [[inputs.snmp.table]]
    name = "snmp"
    inherit_tags = ["hostname", "agent_host"]

    [[inputs.snmp.table.field]]
      name = "cpu_1min_pct"
      oid = "1.3.6.1.4.1.9.9.109.1.1.1.1.7"

[[processors.regex]]
  [[processors.regex.tags]]
    key = "hostname"
    pattern = '^([^.]+)\..*$'
    replacement = "${1}"

[[inputs.snmp_trap]]
  ## Address and port to listen on.
  ## "udp://:162" binds to UDP port 162 on all IPv4 and IPv6 interfaces.
  service_address = "udp://:162"
  ## Timeout for responses (applicable for SNMP Inform requests)
  timeout = "5s"
  ## Directory containing vendor and standard MIB files for OID resolution
  path = ["/usr/share/snmp/mibs"]
# ---------------------------------------------------------
# Elasticsearch Output
# ---------------------------------------------------------
[[outputs.elasticsearch]]
  urls = ["http://127.0.0.1:9200"]
  username = "${ES_USER}"
  password = "${ES_PASSWORD}"

  # Target the data stream name
  index_name = "snmp-army-telegraf-%Y.%m.%d"
  # Disable legacy template pushing
  manage_template = false