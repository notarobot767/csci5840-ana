hostname r2
system l1
  unsupported speed action error
  unsupported error-correction action error
!
#############
# Enable IPv6
#############
no ip routing
ipv6 unicast-routing
!
service routing protocols model multi-agent
no service interface inactive port-id allocation disabled
!
#######
# users
#######
username neteng privilege 15 role network-admin secret sha512 donttreadonme!!
!
aaa authorization exec default local
no aaa authorization config-commands
aaa accounting exec default start-stop logging
!
######
# misc
######
spanning-tree mode rapid-pvst
snmp-server community password ro
!
logging event login root
logging buffered 51200 warnings
logging host 2600:bad:c0de:cafe::10
logging format timestamp high-resolution
logging format hostname fqdn
logging format sequence-numbers
logging level default informational
!
management api http-commands
  no shutdown
!
ip route 0.0.0.0/0 172.20.20.1
!
#######
# VLANs
#######
vlan 2
   name NATIVE
!
vlan 10
   name RED
!
vlan 20
   name GREEN
!
vlan 30
   name BLUE
!
vlan 222
   name MGMT
!
############
# Interfaces
############
interface Loopback0
    ipv6 enable
                                                                    ipv6 address 2600:BAD:C0DE::2/128
                                                        ospfv3 ipv6 network point-to-point
              ospfv3 ipv6 area 0.0.0.0
            !
interface Ethernet1
  description to s4
    no switchport
      ipv6 enable
                no ospfv3 passive-interface
                ospfv3 ipv6 hello-interval 1
              ospfv3 ipv6 dead-interval 4
                    ospfv3 ipv6 network point-to-point
              ospfv3 ipv6 area 0.0.0.0
            !
interface Ethernet2
  description to s2
    no switchport
      ipv6 enable
            isis enable CORE
      isis metric 10
      isis network point-to-point
    !
############
# Route-Maps
############
route-map RM-ISIS-TO-OSPF3 deny 10
  match tag 110
!
route-map RM-ISIS-TO-OSPF3 permit 20
  set metric-type type-1
  set tag 110
!
route-map RM-OSPF3-TO-ISIS deny 10
  match tag 15
!
route-map RM-OSPF3-TO-ISIS permit 20
  set tag 110
!
######
# ISIS
######
router isis CORE
  net 49.0001.0000.0000.0002.00
  is-type level-2
  !
  address-family ipv6 unicast
    redistribute ospfv3 match internal route-map RM-OSPF3-TO-ISIS
    redistribute ospfv3 match external route-map RM-OSPF3-TO-ISIS
    multi-topology
!
########
# OSPFv3
########
router ospfv3
  address-family ipv6
    router-id 2.2.2.0
    passive-interface default
    redistribute isis level-2 route-map RM-ISIS-TO-OSPF3
!
end