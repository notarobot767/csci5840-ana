hostname r3
ip domain name army.mil
system mode insecure
!
#############
# Enable IPv6
#############
ipv6 unicast-routing
ipv6 multicast-routing
!
##########################
# Cisco Express Forwarding
##########################
ip cef distributed
ipv6 cef distributed
!
#####
# vrf
##### 
!
#######
# users
#######
username neteng privilege 15 algorithm-type sha256 secret donttreadonme!!
!
line vty 0 4
  transport input ssh
  transport output ssh
  login local
  logging synchronous
!
##############
# restrict SSH
##############
ip ssh server algorithm hostkey ecdsa-sha2-nistp521 ecdsa-sha2-nistp384
ip ssh server algorithm kex curve25519-sha256 curve25519-sha256@libssh.org ecdh-sha2-nistp521 ecdh-sha2-nistp384
ip ssh server algorithm encryption chacha20-poly1305@openssh.com aes256-gcm aes256-gcm@openssh.com aes128-gcm aes128-gcm@openssh.com aes256-ctr aes192-ctr aes128-ctr
ip ssh server algorithm mac hmac-sha2-512-etm@openssh.com hmac-sha2-256-etm@openssh.com hmac-sha2-512 hmac-sha2-256
!
ip ssh version 2
ip ssh dscp 40
!
##################
# restrict console
##################
line console 0
  transport output ssh
  login local
  logging synchronous
!
#############
# disable aux
#############
line aux 0
  no exec
  transport input none
!
######
# misc
######
ip tcp path-mtu-discovery
no ip domain lookup
no ip boot server
no ip bootp server
no ip dns server
no ip finger
no ip forward-protocol nd
no ip http server
no ip http secure-server
no ip rcmd rcp-enable
no ip rcmd rsh-enable
no ip source-route
!
ip arp gratuitous none
no ip gratuitous-arps
!
service nagle
service tcp-keepalives-in
service tcp-keepalives-out
service password-encryption
!
no service config
no service finger
no service tcp-small-servers
no service udp-small-servers
no service pad
no service call-home
no service config
!
no boot network
vtp mode off
spanning-tree mode rapid-pvst
!
############
# enable cdp
############
cdp run
!
###############
# rate-limiting
###############
ip icmp rate-limit unreachable 500 log
ip icmp rate-limit unreachable df 500 log
ip igmp limit 500
!
interface Loopback0
 no ip proxy-arp
 no ip redirects
 ipv6 enable
 ipv6 address 2600:BAD:C0DE::3/128
 no ipv6 redirects
 ospfv3 network point-to-point
 ospfv3 21 ipv6 area 0
 no shutdown
!
interface GigabitEthernet2
 description to r5
 no ip proxy-arp
 no ip redirects
 ipv6 enable
 no ipv6 redirects
 no shutdown
!
interface GigabitEthernet3
 description to r4
 no ip proxy-arp
 no ip redirects
 ipv6 enable
 no ipv6 redirects
 ospfv3 network point-to-point
 ospfv3 hello-interval 1
 ospfv3 21 ipv6 area 0
 no shutdown
!
interface GigabitEthernet4
 description to s3
 no ip proxy-arp
 no ip redirects
 ipv6 enable
 no ipv6 redirects
 ospfv3 network point-to-point
 ospfv3 hello-interval 1
 ospfv3 21 ipv6 area 0
 no shutdown
!
########
# OSPFv3
########
router ospfv3 21
 address-family ipv6 unicast
  router-id 3.3.3.0
  passive-interface default
  no passive-interface GigabitEthernet3
  no passive-interface GigabitEthernet4
  default-information originate metric 20 metric-type 1
 exit-address-family
!
#####
# BGP
#####
router bgp 26
 bgp router-id 3.3.3.0
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
!
 address-family ipv6
  network 2600:BAD:C0DE::/48
  neighbor FE80::5%GigabitEthernet2 activate
  neighbor FE80::5%GigabitEthernet2 route-map RM-BGP-TO-R5-OUT out
 exit-address-family
!
!
#####
# ntp
#####
ntp logging
ntp source Loopback0
ntp server 2600:bad:c0de:cafe::10
!
#########
# Netflow
#########
flow record BASELINE
  match ipv4 source address
  match ipv4 destination address
  match ipv4 protocol
  match transport source-port
  match transport destination-port
  collect counter bytes long
  collect counter packets long
  collect flow direction
  collect interface input
  collect interface output
  collect ipv4 dscp
  collect ipv4 header-length
  collect ipv4 tos
  collect ipv4 ttl
  collect transport tcp flags
  collect ipv4 fragmentation flags
  collect transport icmp ipv4 type
  collect transport icmp ipv4 code
  collect transport igmp type
!
flow exporter BASELINE
  description badcode
  destination 2600:bad:c0de:cafe::10
  source loopback0
  transport udp 2055
  export-protocol ipfix
!
######
# SNMP
######
snmp-server community password RO
snmp-server trap-source Loopback0
snmp ifmib ifindex persist
!