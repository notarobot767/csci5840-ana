hostname s1
system l1
  unsupported speed action error
  unsupported error-correction action error
!
#############
# Enable IPv6
#############
no ip routing
ipv6 unicast-routing
!
service routing protocols model multi-agent
no service interface inactive port-id allocation disabled
!
#######
# users
#######
username neteng privilege 15 role network-admin secret sha512 donttreadonme!!
!
aaa authorization exec default local
no aaa authorization config-commands
aaa accounting exec default start-stop logging
!
######
# misc
######
spanning-tree mode rapid-pvst
snmp-server community password ro
!
logging event login root
logging buffered 51200 warnings
logging host 2600:bad:c0de:cafe::10
logging format timestamp high-resolution
logging format hostname fqdn
logging format sequence-numbers
logging level default informational
!
management api http-commands
  no shutdown
!
ip route 0.0.0.0/0 172.20.20.1
!
#######
# VLANs
#######
vlan 2
   name NATIVE
!
vlan 10
   name RED
!
vlan 20
   name GREEN
!
vlan 30
   name BLUE
!
vlan 222
   name MGMT
!
############
# Interfaces
############
interface Loopback0
    ipv6 enable
                                                                    ipv6 address 2600:BAD:C0DE:11/128
                        isis enable CORE
      isis metric 10
      !
interface Ethernet1
  description to r1
    no switchport
      ipv6 enable
            isis enable CORE
      isis metric 10
      isis network point-to-point
    !
interface Ethernet2
  description to s2
    no switchport
      ipv6 enable
            isis enable CORE
      isis metric 10
      isis network point-to-point
    !
interface Ethernet3
  description to H1
    switchport
    switchport access vlan 10
        spanning-tree portfast edge
      spanning-tree bpduguard enable
  !
interface Ethernet4
  description to H2
    switchport
    switchport access vlan 20
        spanning-tree portfast edge
      spanning-tree bpduguard enable
  !
interface Vlan10
    ipv6 enable
                                                                                          ipv6 address 2600:bad:c0de:110::1/64
                        ipv6 address fe80::1 link-local
                        isis enable CORE
      isis metric 10
      isis network point-to-point
      isis passive
  !
interface Vlan20
    ipv6 enable
                                                                                          ipv6 address 2600:bad:c0de:120::1/64
                        ipv6 address fe80::1 link-local
                        isis enable CORE
      isis metric 10
      isis network point-to-point
      isis passive
  !
############
# Route-Maps
############
######
# ISIS
######
router isis CORE
  net 49.0001.0000.0000.0011.00
  is-type level-2
  !
  address-family ipv6 unicast
    multi-topology
!
########
# OSPFv3
########
!
end