---
hostname: r2
template: ceos.j2
role: router
interfaces:
  Loopback0:
    ipv6:
      enable: true
      address:
        - address: 2600:BAD:C0DE::2
          netmask: 128
    ospfv3:
      process:
        21:
          ipv6:
            area: 0
            network: point-to-point
  Ethernet1:
    description: "to s4"
    switchport: false
    ipv6:
     enable: true
    ospfv3:
      process:
        21:
          passive-interface: false
          ipv6:
            area: 0
            network: point-to-point
            hello-interval: 1
            dead-interval: 4
  Ethernet2:
    description: "to s2"
    switchport: false
    ipv6:
     enable: true
    isis:
      enable: core
      metric: 10
      network: point-to-point
route-map:
  - map: RM-ISIS-TO-OSPF3
    deny: 10
    match:
      - tag: 110
  - map: RM-ISIS-TO-OSPF3
    permit: 20
    set:
      - metric-type: type-1
      - tag: 110
  - map: RM-OSPF3-TO-ISIS
    deny: 10
    match:
      - tag: 15
  - map: RM-OSPF3-TO-ISIS
    permit: 20
    set:
      - tag: 110

isis:
  core:
    net: "49.0001.0000.0000.0002.00"
    is-type: level-2
    address-family:
      - family: ipv6
        redistribute:
        - "ospfv3 match internal route-map RM-OSPF3-TO-ISIS"
        - "ospfv3 match external route-map RM-OSPF3-TO-ISIS"
        multi-topology: true
    

ospfv3:
  21:
    address-family:
      - family: ipv6
        rid: 2.2.2.0
        passive-interface: default
        redistribute:
          - "isis level-2 route-map RM-ISIS-TO-OSPF3"