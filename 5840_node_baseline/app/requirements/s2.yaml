---
hostname: s2
template: ceos.j2
role: router
vlans: true
interfaces:
  Loopback0:
    ipv6:
      enable: true
      address:
        - address: 2600:BAD:C0DE:12
          netmask: 128
    isis:
      enable: core
      metric: 10
  Ethernet1:
    description: "to r2"
    switchport: false
    ipv6:
     enable: true
    isis:
      enable: core
      metric: 10
      network: point-to-point
  Ethernet2:
    description: "to s1"
    switchport: false
    ipv6:
     enable: true
    isis:
      enable: core
      metric: 10
      network: point-to-point
  Ethernet3:
    description: "to H3"
    switchport: true
    switch:
      address: 10
    spanning-tree:
      portfast: edge
      bpduguard: true
  Ethernet4:
    description: "to H4"
    switchport: true
    switch:
      address: 30
    spanning-tree:
      portfast: edge
      bpduguard: true
  Vlan10:
    ipv6:
      enable: true
      address:
        - address: 2600:bad:c0de:210::1
          mask: 64
        - address: fe80::1
          link_local: true
    isis:
      enable: core
      metric: 10
      network: point-to-point
      passive: true
  Vlan30:
    ipv6:
      enable: true
      address:
        - address: 2600:bad:c0de:230::1
          mask: 64
        - address: fe80::1
          link_local: true
    isis:
      enable: core
      metric: 10
      network: point-to-point
      passive: true
isis:
  core:
    net: "49.0001.0000.0000.0012.00"
    is-type: level-2
    address-family:
      - family: ipv6
        multi-topology: true